name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  compose-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pipeline delegates entirely to the Makefile: `make ci` builds and runs the
      # py (pytest) and node (jsdom + Playwright + openspec validate) containers from
      # docker-compose-files/ci.yaml. The same command works locally — one gate, everywhere.
      - name: Run the containerized gate (make ci)
        run: make ci
