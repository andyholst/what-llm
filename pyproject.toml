[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "whatllm"
version = "0.1.0"
description = "HF trending-model crawler + hardware compatibility estimator (what-llm)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "huggingface_hub>=0.23,<1.0",
    "requests>=2.31,<3.0",
    "jsonschema>=4.20,<5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
